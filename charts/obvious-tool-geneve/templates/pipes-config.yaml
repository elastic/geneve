apiVersion: v1
kind: ConfigMap
metadata:
  name: geneve-obvious-tool-{{ required "obvious.execution.id is required" .Values.obvious.execution.id }}-pipes
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: geneve-obvious-tool
    obvious.io/execution-id: {{ .Values.obvious.execution.id | quote }}
data:
  geneve-obvious-tool.yaml: |
    # A caller can narrow discovery to stable rule IDs. Without that input,
    # Geneve discovers the target's enabled Detection Engine rules at startup.
    pipes:
      - elastic.pipes:
          logging:
            level: info
            format: json

      - elastic.pipes.kbn.rules.get:
          # Regardless of whether the caller pins stable IDs, Geneve generates
          # only for rules that Kibana currently reports as enabled.
          filter:
            enabled: true
          {{ if .Values.geneve.ruleIds }}
          # A nonempty caller list narrows discovery to its stable rule IDs.
          {{ $ruleIDs := mustFromJson .Values.geneve.ruleIds }}
          {{ if not (kindIs "slice" $ruleIDs) }}{{ fail "geneve.ruleIds must be a JSON array" }}{{ end }}
          {{ if eq (len $ruleIDs) 0 }}{{ fail "geneve.ruleIds must not be empty" }}{{ end }}
          rule-ids:
          {{ range $ruleID := $ruleIDs }}
          {{ if not (kindIs "string" $ruleID) }}{{ fail "geneve.ruleIds entries must be strings" }}{{ end }}
            - {{ $ruleID | quote }}
          {{ end }}
          {{ end }}

      - elastic.pipes.geneve.generate:
          schema-uri: "https://github.com/elastic/ecs/archive/refs/heads/main.tar.gz"
          triggers-per-second@: runtime.arguments.triggers-per-second
          destinations:
            process: logs-endpoint.events.process-default
            file: logs-endpoint.events.file-default
            network: logs-endpoint.events.network-default
            registry: logs-endpoint.events.registry-default
            library: logs-endpoint.events.library-default
            device: logs-endpoint.events.device-default
            api: logs-endpoint.events.api-default
            security: logs-endpoint.events.security-default

      - elastic.pipes.es.bulk:
          batch-size: 25
          request-timeout: 120

    # The execution supplies target URLs as regular inputs. The controller
    # materializes the caller-referenced GSM API key per execution, and the
    # Deployment injects all three values as environment variables.
    stack:
      shell-expand: true
      elasticsearch:
        url: "$GENEVE_TARGET_ES_URL"
      kibana:
        url: "$GENEVE_TARGET_KIBANA_URL"
      credentials:
        api-key: "$GENEVE_TARGET_API_KEY"

    documents: []
    rules: []
